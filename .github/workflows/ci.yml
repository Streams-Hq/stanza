name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CI: true

jobs:
  contract:
    name: Soroban contract (fmt, test, wasm)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32v1-none
          components: rustfmt

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: contracts/stanza

      - name: Format check
        run: cargo fmt --manifest-path contracts/stanza/Cargo.toml --check

      - name: Contract unit tests
        run: cargo test --manifest-path contracts/stanza/Cargo.toml

      - name: Build wasm
        run: cargo build --manifest-path contracts/stanza/Cargo.toml --target wasm32v1-none --release

  app:
    name: SDK, indexer and web app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.30.1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: SDK tests
        run: pnpm --filter @stanza/sdk test

      - name: Build SDK
        run: pnpm --filter @stanza/sdk build

      - name: Build indexer
        run: pnpm --filter @stanza/indexer build

      - name: Build web app
        run: pnpm --filter web build
        env:
          NEXT_PUBLIC_STELLAR_NETWORK_PASSPHRASE: 'Test SDF Network ; September 2015'
          NEXT_PUBLIC_SOROBAN_RPC_URL: 'https://soroban-testnet.stellar.org'
          NEXT_PUBLIC_STANZA_CONTRACT_ID: ''
          NEXT_PUBLIC_INDEXER_URL: 'http://localhost:3001'

  docs:
    name: Documentation build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-docs.txt

      - name: Install docs dependencies
        run: pip install -r requirements-docs.txt

      - name: Build docs (strict)
        run: mkdocs build --strict
