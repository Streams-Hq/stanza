site_name: Stanza
site_description: >-
  Non-custodial recurring subscriptions on Stellar — Soroban contract, SDK,
  indexer, and app documentation.
site_url: https://streams-hq.github.io/stanza/
repo_url: https://github.com/Streams-Hq/stanza
repo_name: Streams-Hq/stanza
edit_uri: edit/main/docs/
copyright: Copyright &copy; 2026 Stanza contributors — MIT licensed

theme:
  name: material
  language: en
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: cyan
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: cyan
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.sections
    - navigation.top
    - navigation.footer
    - content.code.copy
    - content.action.edit
    - search.suggest
    - search.highlight
    - toc.follow
  icon:
    repo: fontawesome/brands/github

nav:
  - Home: index.md
  - Introduction: introduction.md
  - Protocol:
      - How billing works: protocol.md
      - Contract reference: contract-reference.md
  - User guides:
      - For merchants: guides/merchant.md
      - For subscribers: guides/subscriber.md
  - Developer guide:
      - Local setup: developers/local-setup.md
      - Environment variables: developers/environment.md
      - Deployment: developers/deployment.md
      - SDK reference: developers/sdk.md
      - Indexer API: developers/api.md
  - Contributing: contributing.md

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
      toc_depth: 3
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/Streams-Hq/stanza
    - icon: fontawesome/solid/globe
      link: https://stellar.org
